[metadata]
name = manimgl
version = 1.7.2
author = Grant Sanderson
author_email= grant@3blue1brown.com
description = Animation engine for explanatory math videos
long_description = file: README.md
long_description_content_type = text/markdown; charset=UTF-8
home_page = https://github.com/3b1b/manim
project_urls =
    Bug Tracker = https://github.com/3b1b/manim/issues
    Documentation = https://3b1b.github.io/manim/
    Source Code = https://github.com/3b1b/manim
license = MIT
classifiers =
    Development Status :: 4 - Beta
    License :: OSI Approved :: MIT License
    Topic :: Scientific/Engineering
    Topic :: Multimedia :: Video
    Topic :: Multimedia :: Graphics
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3 :: Only
    Natural Language :: English

[options]
packages = find:
include_package_data = True
python_requires = >=3.10
install_requires =
    addict
    appdirs
    audioop-lts; python_version >= "3.13"
    colour
    diskcache
    ipython>=8.18.0
    isosurfaces
    fontTools
    glfw
    manimpango>=0.6.0
    matplotlib
    numpy
    Pillow
    pydub
    pygments
    pyperclip
    pywavefront
    pyyaml
    rendercanvas
    rich
    scipy
    setuptools
    skia-pathops
    svgelements>=1.8.1
    sympy
    trimesh
    tqdm
    typing-extensions; python_version < "3.11"
    validators
    wgpu
[options.entry_points]
console_scripts =
    manimgl = manimlib.__main__:main
    manim-render = manimlib.__main__:main
